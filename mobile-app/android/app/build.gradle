apply plugin: 'com.android.application'

android {
    namespace = "es.melonhub.MelonHub"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "es.melonhub.MelonHub"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "1.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    /* Dos builds de la misma app (mismo applicationId y misma clave: una se
       instala encima de la otra), cada una con su web y su release de
       GitHub para las actualizaciones (MelonUpdaterPlugin):
         dev  → melonhubdev.melonhub.es, release movil-dev
         prod → melonhub.es,             release movil
       En Android Studio: Build Variants → devRelease / prodRelease, o
       "Generate Signed App Bundle or APK" eligiendo la variante. Salen en
       app/dev/release/ y app/prod/release/. */
    buildFeatures {
        buildConfig = true
    }
    flavorDimensions = ["entorno"]
    productFlavors {
        dev {
            dimension "entorno"
            buildConfigField "String", "RELEASE_URL", '"https://github.com/EduConPar/Scrapbook-Online/releases/download/movil-dev/"'
        }
        prod {
            dimension "entorno"
            buildConfigField "String", "RELEASE_URL", '"https://github.com/EduConPar/Scrapbook-Online/releases/download/movil/"'
        }
    }
    /* La web que abre la app es server.url de capacitor.config.json (lo
       copia `npx cap sync` a src/main/assets, apuntando a dev). La de prod
       se saca de esa misma cada vez que se construye, cambiando solo la
       dirección, y va en sus assets (pisan a los de main): así no hay que
       mantener dos copias. */
    sourceSets {
        prod {
            assets.srcDirs += ["$buildDir/generated/assets-prod"]
        }
    }
}

def configDev = file('src/main/assets/capacitor.config.json')
def configProd = file("$buildDir/generated/assets-prod/capacitor.config.json")
def textoDev = configDev.getText('UTF-8')
def textoProd = textoDev.replace('https://melonhubdev.melonhub.es/mobile.php', 'https://melonhub.es/mobile.php')
if (textoProd == textoDev) {
    throw new GradleException('capacitor.config.json no apunta a https://melonhubdev.melonhub.es/mobile.php: no se puede sacar la de prod')
}
configProd.parentFile.mkdirs()
if (!configProd.exists() || configProd.getText('UTF-8') != textoProd) configProd.setText(textoProd, 'UTF-8')

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    /* AvisosService (avisos push con estilo): la misma versión que usa
       @capacitor/push-notifications. */
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
