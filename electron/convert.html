<!DOCTYPE html>
<!--
    Conversión de audio de las descargas (download.js), en una ventana
    oculta: Chromium decodifica el audio de YouTube (AAC/Opus) y lamejs lo
    codifica en MP3; el WAV se escribe a mano. Así no hace falta ffmpeg.
    lame.min.js es la versión para navegador de lamejs: la de require()
    falla ("MPEGMode is not defined").
-->
<html>
<head>
<meta charset="utf-8">
<script src="node_modules/lamejs/lame.min.js"></script>
<script>
const fs = require('fs');
const RATE = 44100;
const BLOCK = 1152;   /* muestras por trama de MP3 */

function toInt16(f32) {
    const out = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
        const v = Math.max(-1, Math.min(1, f32[i]));
        out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    return out;
}

function mp3(audio, kbps) {
    const ch = Math.min(2, audio.numberOfChannels);
    const left = toInt16(audio.getChannelData(0));
    const right = ch > 1 ? toInt16(audio.getChannelData(1)) : null;
    const enc = new lamejs.Mp3Encoder(ch, RATE, kbps);
    const parts = [];
    for (let i = 0; i < left.length; i += BLOCK) {
        const l = left.subarray(i, i + BLOCK);
        const buf = right ? enc.encodeBuffer(l, right.subarray(i, i + BLOCK)) : enc.encodeBuffer(l);
        if (buf.length) parts.push(Buffer.from(buf));
    }
    const end = enc.flush();
    if (end.length) parts.push(Buffer.from(end));
    return Buffer.concat(parts);
}

/* PCM de 16 bits, intercalado. */
function wav(audio) {
    const ch = Math.min(2, audio.numberOfChannels);
    const chans = Array.from({ length: ch }, (_, c) => toInt16(audio.getChannelData(c)));
    const frames = chans[0].length, bytes = frames * ch * 2;
    const b = Buffer.alloc(44 + bytes);
    b.write('RIFF', 0); b.writeUInt32LE(36 + bytes, 4); b.write('WAVE', 8);
    b.write('fmt ', 12); b.writeUInt32LE(16, 16); b.writeUInt16LE(1, 20); b.writeUInt16LE(ch, 22);
    b.writeUInt32LE(RATE, 24); b.writeUInt32LE(RATE * ch * 2, 28); b.writeUInt16LE(ch * 2, 32); b.writeUInt16LE(16, 34);
    b.write('data', 36); b.writeUInt32LE(bytes, 40);
    let o = 44;
    for (let i = 0; i < frames; i++) for (let c = 0; c < ch; c++) { b.writeInt16LE(chans[c][i], o); o += 2; }
    return b;
}

async function convertAudio({ input, output, format, kbps }) {
    const data = fs.readFileSync(input);
    /* OfflineAudioContext: decodifica sin abrir la salida de audio. */
    const ctx = new OfflineAudioContext(2, 1, RATE);
    const audio = await ctx.decodeAudioData(data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength));
    fs.writeFileSync(output, format === 'wav' ? wav(audio) : mp3(audio, kbps));
    return true;
}
</script>
</head>
<body></body>
</html>
