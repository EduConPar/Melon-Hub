<!doctype html><html><head><meta charset="utf-8"><title>Melon Hub (prueba)</title>
<link rel="stylesheet" href="assets/css/98.css"><link rel="stylesheet" href="theme.css"></head>
<body class="tema-prueba"><h1>Ventana principal falsa</h1><script>
const st = { hasTrack: true, title: 'Kill Or Be Killed', artist: 'Muse', cover: new URL('cover.jpg', location.href).href,
             playlist: 'Playlist para bombardear peru', playing: true, position: 30, duration: 300 };
setInterval(() => { if (st.playing) st.position += 0.5; melonDesktop.setNowPlaying(st); }, 500);
melonDesktop.onPlayerCommand((a, v) => {
  console.log('ORDEN ' + a + (v !== undefined ? ' ' + Math.round(v) : ''));
  if (a === 'pause') st.playing = false;
  if (a === 'toggle') st.playing = !st.playing;
  if (a === 'seekto') st.position = v;
});
</script></body></html>
