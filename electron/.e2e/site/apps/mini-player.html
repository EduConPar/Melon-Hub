<!DOCTYPE html>
<!--
    REPRODUCTOR FLOTANTE de la app de escritorio (electron/mini-player.js).
    Copia de la ventana del reproductor del escritorio (apps/reproductor.php,
    mismos ids → mismo reproductor.css) en una ventanita aparte que sale al
    cerrar Melon Hub con música sonando. No reproduce nada: la música sigue
    en la ventana principal, escondida; esta solo enseña lo que suena y le
    manda los botones (window.melonDesktop.mini).
    El tema y la interfaz del usuario los copia de la ventana principal al
    abrirse (melon:mini-look), así que se ve igual que su reproductor.
-->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Melon Hub</title>
    <base href="../">
    <link rel="stylesheet" href="assets/css/98.css">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/reproductor.css">
    <script src="assets/js/icon-pack.js"></script>
    <!-- Va siempre la última: el CSS del escritorio que se copia de la
         ventana principal se inserta delante. -->
    <style id="mini-overrides">
        html, body { margin: 0; padding: 0; background: none !important; overflow: hidden; }
        #music-player { position: static; margin: 0; width: 290px; }
        /* Ventana sin marco del sistema: se arrastra por la barra de título. */
        #player-titlebar { -webkit-app-region: drag; user-select: none; }
        #player-titlebar button,
        #player-body { -webkit-app-region: no-drag; }
    </style>
</head>
<body>
<div class="window" id="music-player">
    <div class="title-bar" id="player-titlebar">
        <div class="title-bar-text" id="player-tb-text"><img src="assets/img/appIcons/musicaIcon.png" style="width:16px;height:16px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;margin-right:4px;" alt=""><span id="player-pl-name">Reproductor</span></div>
        <div class="title-bar-controls">
            <button aria-label="Restore" id="mini-open" title="Abrir Melon Hub"></button>
            <button aria-label="Close" id="mini-close" title="Cerrar el reproductor"></button>
        </div>
    </div>
    <div class="window-body" id="player-body">
        <div id="player-content">
            <div id="player-main">
                <div id="player-cover-wrap" style="position:relative;">
                    <img id="player-cover" src="" alt="">
                </div>
                <div id="player-info">
                    <p id="player-title">Sin título</p>
                    <p id="player-artist">—</p>
                </div>
            </div>
            <input type="range" id="player-progress" min="0" max="100" value="0" step="0.1">
            <div id="player-time">
                <span id="player-current">0:00</span>
                <span id="player-duration">0:00</span>
            </div>
            <div id="player-controls">
                <button class="button" id="btn-prev">◄◄</button>
                <button class="button" id="btn-play">►</button>
                <button class="button" id="btn-next">►►</button>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    var md = window.melonDesktop;
    if (!md || !md.mini) return;   /* solo tiene sentido dentro de la app */
    function $(id) { return document.getElementById(id); }

    function fmt(s) {
        s = Math.max(0, Math.floor(s || 0));
        return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    }

    /* Mismo desplazamiento del título largo que el reproductor del
       escritorio (marqueeScroll de apps/reproductor.php). */
    function marqueeScroll(el, parent, speed, pauseMs) {
        el.style.transform = 'translateX(0)';
        var pos = 0, last = null, fromRight = false, raf = null, timer = null;
        var W = el.offsetWidth, C = parent.clientWidth;
        if (W <= C) return function() {};
        function tick(ts) {
            if (!last) last = ts;
            var dt = Math.min(ts - last, 50);
            last = ts;
            pos -= speed * dt / 1000;
            if (pos < -W) { pos = C + (pos + W); fromRight = true; }
            if (fromRight && pos <= 0) {
                pos = 0; fromRight = false;
                el.style.transform = 'translateX(0)';
                last = null;
                timer = setTimeout(function() { raf = requestAnimationFrame(tick); }, pauseMs);
                return;
            }
            el.style.transform = 'translateX(' + pos + 'px)';
            raf = requestAnimationFrame(tick);
        }
        timer = setTimeout(function() { raf = requestAnimationFrame(tick); }, pauseMs);
        return function() {
            clearTimeout(timer);
            if (raf) cancelAnimationFrame(raf);
            el.style.transform = '';
        };
    }

    /* La ventana se ajusta al tamaño de la ventana Win98 dibujada. */
    function fit() {
        requestAnimationFrame(function() {
            var r = $('music-player').getBoundingClientRect();
            md.mini.fit(Math.ceil(r.width), Math.ceil(r.height));
        });
    }

    var duration = 0, seeking = false, lastTitle = null, lastCover = '', stopMarquee = null;
    function render(s) {
        if (!s) return;
        $('player-pl-name').textContent = s.playlist || 'Reproductor';
        var title = s.hasTrack ? (s.title || 'Sin título') : 'Sin título';
        if (title !== lastTitle) {
            lastTitle = title;
            $('player-title').textContent = title;
            if (stopMarquee) { stopMarquee(); stopMarquee = null; }
            setTimeout(function() { stopMarquee = marqueeScroll($('player-title'), $('player-title').parentElement, 50, 1000); }, 50);
        }
        $('player-artist').textContent = s.artist || '—';
        if (s.cover && s.cover !== lastCover) { lastCover = s.cover; $('player-cover').src = s.cover; }
        $('btn-play').textContent = s.playing ? '⏸' : '►';
        duration = s.duration || 0;
        if (!seeking) $('player-progress').value = duration > 0 ? (s.position / duration) * 100 : 0;
        $('player-current').textContent = fmt(s.position);
        $('player-duration').textContent = fmt(duration);
    }

    /* Tema e interfaz del usuario: el CSS de la ventana principal se
       inserta delante de los overrides de esta página. */
    function applyLook(look) {
        if (!look) return;
        var overrides = $('mini-overrides');
        document.querySelectorAll('link[data-look]').forEach(function(l) { l.remove(); });
        (look.css || []).forEach(function(href) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = href;
            l.setAttribute('data-look', '');
            l.onload = fit;
            overrides.parentNode.insertBefore(l, overrides);
        });
        document.documentElement.className = look.htmlClass || '';
        document.body.className = look.bodyClass || '';
        fit();
    }

    $('btn-prev').addEventListener('click', function() { md.mini.command('previoustrack'); });
    $('btn-play').addEventListener('click', function() { md.mini.command('toggle'); });
    $('btn-next').addEventListener('click', function() { md.mini.command('nexttrack'); });
    $('player-progress').addEventListener('input', function() { seeking = true; });
    $('player-progress').addEventListener('change', function() {
        if (duration > 0) md.mini.command('seekto', (this.value / 100) * duration);
        seeking = false;
    });
    $('mini-open').addEventListener('click', function() { md.mini.openMain(); });
    $('mini-close').addEventListener('click', function() { md.mini.close(); });

    md.mini.onLook(applyLook);
    md.mini.onState(render);
    fit();
})();
</script>
</body>
</html>
