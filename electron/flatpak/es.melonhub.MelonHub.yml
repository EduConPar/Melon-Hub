# Flatpak de Melon Hub para Linux. Lo construye electron/build.sh dentro de
# un contenedor: empaqueta la app ya compilada por electron-builder
# (dist/linux-unpacked) sobre la base de Electron de Flathub, que trae
# zypak para que el sandbox de Chromium funcione dentro de Flatpak.
app-id: es.melonhub.MelonHub
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: melonhub
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Notificaciones del sistema y, más adelante, el icono de la bandeja.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Guardar descargas (imagen del Wrapped…). Para subir fotos se usa el
  # selector de archivos del sistema (portal), que no necesita permisos.
  - --filesystem=xdg-download
modules:
  - name: melonhub
    buildsystem: simple
    build-commands:
      - cp -a linux-unpacked /app/melonhub
      - install -Dm755 melonhub.sh /app/bin/melonhub
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/es.melonhub.MelonHub.png
      - install -Dm644 es.melonhub.MelonHub.desktop -t /app/share/applications
      - install -Dm644 es.melonhub.MelonHub.metainfo.xml -t /app/share/metainfo
    sources:
      - type: dir
        path: ../dist/linux-unpacked
        dest: linux-unpacked
      - type: file
        path: ../icon.png
      - type: file
        path: melonhub.sh
      - type: file
        path: es.melonhub.MelonHub.desktop
      - type: file
        path: es.melonhub.MelonHub.metainfo.xml
